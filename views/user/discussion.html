<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Messageri(re) - Discussion</title>
    <link rel="stylesheet" href="../../public/css/discussion-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />   
</head>
<body>

    <div class="container">
        <div class="channels">
            <ul>
                <li># Général</li>
            </ul>
        </div>

        <div class="header-bar">
            <button>Paramètres</button>
            <button>Se déconnecter</button>
        </div>

        <div class="discussion">
            <div class="messages">
                <div class="message">
                    <span class="username">Tom</span>
                    <span class="text">Bonjour à tous !</span>
                </div>
                <div class="message">
                    <span class="username">Paul</span>
                    <span class="text">Salut ! Comment ça va ?</span>
                </div>
            </div>
            <form class="message-form">
                <input type="text" placeholder="Écrire un message...">
                <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>
    
</body>
</html>
