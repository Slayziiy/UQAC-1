<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messageri(re) - Connexion</title>
    <link rel="stylesheet" href="../../public/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../public/js/script.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <div class="left">
                <a href="../index.html"><img src="../../public/img/logo.png" alt="Logo"></a>
            </div>
            <div class="middle">
                <a href="../index.html"><i class="fa-solid fa-house"></i> Accueil</a>
                <a href="../legal/guide.html"><i class="fa-solid fa-book"></i> Guide</a>
                <a href="../ranking.html"><i class="fa-solid fa-trophy"></i> Classement</a>
            </div>
            <div class="right">
                <a href="#" class="login-button"><i class="fa-solid fa-arrow-right-to-bracket"></i> Connexion</a>
                <a href="register.html" class="register-button"><i class="fa-solid fa-user"></i> Inscription</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-container card">
            <h1>Se connecter</h1>
            
            <form id="login-form" novalidate>
                <span>
                    <label for="login-pseudo"><i class="fa-regular fa-circle-user"></i> Nom d'utilisateur</label>
                    <input type="text" id="login-pseudo" name="pseudo" autocomplete="username" required>
                    <small class="field-error" id="login-pseudo-error"></small>
                </span>
                
                <span>
                    <label for="login-password"><i class="fa-solid fa-key"></i> Mot de passe</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                    <small class="field-error" id="login-password-error"></small>
                </span>

                <small class="field-error" id="login-form-error"></small>

                <button type="submit" id="login-submit-btn">Connexion</button>
            </form>
        </div> 
    </main>
</body>
</html>
