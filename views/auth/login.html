<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messageri(re) - Connexion</title>
    <link rel="stylesheet" href="../../public/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../public/js/script.js" defer></script>
</head>
<body data-root="..">
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    <header>
        <nav aria-label="Navigation principale">
            <div class="left">
                <a href="../index.html"><img src="../../public/img/logo.png" alt="Logo Messageri(re)"></a>
            </div>
            <div class="middle">
                <a href="../index.html"><i class="fa-solid fa-house" aria-hidden="true"></i> Accueil</a>
                <a href="../legal/guide.html"><i class="fa-solid fa-book" aria-hidden="true"></i> Guide</a>
                <a href="../ranking.html"><i class="fa-solid fa-trophy" aria-hidden="true"></i> Classement &amp; Quiz</a>
            </div>
            <div class="right"></div>
        </nav>
    </header>

    <main id="main-content">
        <div class="form-container card">
            <h1>Se connecter</h1>

            <form id="login-form" novalidate>
                <span>
                    <label for="login-pseudo"><i class="fa-regular fa-circle-user" aria-hidden="true"></i> Nom d'utilisateur</label>
                    <input type="text" id="login-pseudo" name="pseudo" autocomplete="username" required>
                    <small class="field-error" id="login-pseudo-error" aria-live="polite"></small>
                </span>

                <span>
                    <label for="login-password"><i class="fa-solid fa-key" aria-hidden="true"></i> Mot de passe</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                    <small class="field-error" id="login-password-error" aria-live="polite"></small>
                </span>

                <small class="field-error" id="login-form-error" aria-live="polite"></small>

                <button type="submit" id="login-submit-btn">Connexion</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="../index.html">Accueil</a>
            <a href="../legal/guide.html">Guide d'utilisation</a>
            <a href="../ranking.html">Classement</a>
            <a href="../legal/legals.html">Mentions légales</a>
        </div>
        <p>&copy; 2026 Delta-Talk -- Tous droits réservés.</p>
    </footer>
</body>
</html>
